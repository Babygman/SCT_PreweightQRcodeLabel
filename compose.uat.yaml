services:
  sct-preweight-uat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sct-preweight-uat
    env_file:
      - .env.uat
    environment:
      APP_ENV: uat
    expose:
      - "8000"
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped
    init: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  nginx-proxy-manager_default:
    external: true
