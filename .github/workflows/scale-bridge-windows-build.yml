name: Scale Bridge Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scale_bridge/**"
      - ".github/workflows/scale-bridge-windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install Inno Setup
        run: choco install innosetup --version=6.4.3 --yes --no-progress
      - name: Build and test installer
        shell: powershell
        run: .\scale_bridge\windows\build.ps1
      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCT-Preweight-Scale-Bridge-Windows-x64-unsigned
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
