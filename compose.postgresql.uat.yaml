services:
  sct-preweight-postgresql-uat:
    image: postgres:17-bookworm
    container_name: sct-preweight-postgresql-uat
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sct_preweight_postgresql_uat_data:/var/lib/postgresql/data
    networks:
      - preweight_postgresql_uat
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  sct-preweight-uat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sct-preweight-uat
    restart: unless-stopped
    depends_on:
      sct-preweight-postgresql-uat:
        condition: service_healthy
    environment:
      APP_ENV: uat
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Bangkok}
      MATERIAL_TAG_ISSUANCE_ENABLED: ${MATERIAL_TAG_ISSUANCE_ENABLED:-0}
      FINISHED_GOODS_MASTER_ENABLED: ${FINISHED_GOODS_MASTER_ENABLED:-0}
    expose:
      - "8000"
    networks:
      - preweight_postgresql_uat
      - nginx-proxy-manager_default
    init: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  preweight_postgresql_uat:
    internal: true
  nginx-proxy-manager_default:
    external: true

volumes:
  sct_preweight_postgresql_uat_data:
